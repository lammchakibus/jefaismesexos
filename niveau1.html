<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niveau 4 - Défi Extrême</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .challenge-container {
      background: #fff;
      border-radius: 5px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    .question {
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 3px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      background: #50b3a2;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover {
      background: #e8491d;
    }
    .feedback {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="challenge-container">
    <h1>Défi Extrême - Niveau 4</h1>
    <div class="question">
      Résous l'équation suivante :<br>
      <em>x<sup>2</sup> - 10x + 21 = 0</em>
    </div>
    <div>
      <label for="answer">Ta réponse (sépare les solutions par une virgule) :</label>
      <input type="text" id="answer" placeholder="exemple: 3,7">
    </div>
    <button onclick="checkAnswer()">Vérifier</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    function checkAnswer() {
      // Pour x² - 10x + 21 = 0, les solutions attendues sont 3 et 7.
      var expectedAnswers = ["3", "7"];
      var userInput = document.getElementById('answer').value;
      var userAnswers = userInput.split(',').map(a => a.trim()).filter(a => a !== "");
      var correct = expectedAnswers.every(ans => userAnswers.includes(ans)) && userAnswers.length === expectedAnswers.length;
      var feedbackElement = document.getElementById('feedback');
      if (correct) {
        feedbackElement.textContent = "Bravo, c'est correct !";
        feedbackElement.style.color = "green";
      } else {
        feedbackElement.textContent = "Ce n'est pas correct. Réessaie !";
        feedbackElement.style.color = "red";
      }
    }
  </script>
</body>
</html>
